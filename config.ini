# The configuration of gracia: serve-db, serve and every command read it with `-c config.ini`
# (or $GRACIA_CONFIG). Comments go on their own line: a comment after a value would be part of it.
[app:main]
# where clients (the web server, the commands, the job processes) reach the database
gracia.db = quack:localhost:9494
# the file `gracia serve-db` opens, and the token it writes next to it (keep the token private)
gracia.db.file = gracia.db
gracia.db.token_file = gracia.db.token
# where each job gets its directory: <jobs_dir>/<uuid>/ (relative to this file)
gracia.jobs_dir = jobs
# how long a finished job and its files are kept by `gracia jobs clean`
gracia.jobs_retention = 8h

gracia.cache_dir = cache
# The most each LMDB cache under cache_dir can hold: a number with K, M, G or T. A file only
# grows as far as it is filled, and a cache that is full is emptied and starts again.
# (an etag takes about 100 bytes, a slug about 80; defaults are shown)
#gracia.cache.graphs_size = 2G
#gracia.cache.docs_size = 2G
#gracia.cache.etags_size = 256M
#gracia.cache.slugs_size = 64M
#gracia.cache.referencing_size = 512M
gracia.worker = true
gracia.index_dir = index
